<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="Portfolio of Hisham Salameh, Full Stack Web Engineer at Apple building accessible, high-performance web experiences">
    <meta name="keywords" content="Full Stack Web Engineer, Frontend Engineer, React, UI Engineer, Web Development, Vue.js, TypeScript, JavaScript, Portfolio">
    <meta name="author" content="Hisham Salameh">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hishamsalameh.com/">
    <meta property="og:title" content="Hisham Salameh - Full Stack Web Engineer Portfolio">
    <meta property="og:description" content="Portfolio of Hisham Salameh, Full Stack Web Engineer at Apple building accessible, high-performance web experiences with React, Vue, and TypeScript. View my work experience, skills, and projects.">
    <meta property="og:image" content="https://hishamsalameh.com/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Hisham Salameh - Full Stack Web Engineer Portfolio">
    <meta property="og:site_name" content="Hisham Salameh Portfolio">
    <meta property="og:locale" content="en_US">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://hishamsalameh.com/">
    <meta property="twitter:title" content="Hisham Salameh - Full Stack Web Engineer Portfolio">
    <meta property="twitter:description" content="Portfolio of Hisham Salameh, Full Stack Web Engineer at Apple building accessible, high-performance web experiences with React, Vue, and TypeScript.">
    <meta property="twitter:image" content="https://hishamsalameh.com/og-image.jpg">
    <meta property="twitter:image:alt" content="Hisham Salameh - Full Stack Web Engineer Portfolio">
    <meta property="twitter:creator" content="@hishamsalameh">
    <meta property="twitter:site" content="@hishamsalameh">

    <!-- LinkedIn -->
    <meta property="article:author" content="Hisham Salameh">
    <meta property="article:published_time" content="2024-01-01T00:00:00Z">
    <meta property="article:modified_time" content="2024-12-01T00:00:00Z">

    <!-- Additional SEO -->
    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">
    <meta name="theme-color" content="#0088ff">
    <meta name="msapplication-TileColor" content="#0088ff">
    <meta name="application-name" content="Hisham Salameh Portfolio">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://hishamsalameh.com/">
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Hisham Salameh",
      "jobTitle": "Full Stack Web Engineer",
      "description": "Full Stack Web Engineer at Apple building accessible, high-performance web experiences with React, Vue, and TypeScript",
      "url": "https://hishamsalameh.com",
      "sameAs": [
        "https://linkedin.com/in/hishamsalameh",
        "https://github.com/salamhis2019"
      ],
      "knowsAbout": [
        "React",
        "Web Accessibility",
        "Web Performance",
        "Frontend Development",
        "Vue.js",
        "TypeScript",
        "JavaScript",
        "Web Development"
      ],
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "Michigan State University"
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Austin",
        "addressRegion": "Texas",
        "addressCountry": "US"
      }
    }
    </script>
    
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>Hisham Salameh - Full Stack Web Engineer Portfolio</title>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
